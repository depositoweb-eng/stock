  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {

    --ng-green-dark: #004d28;
    --ng-green-light: #e0f0e9;
    --ng-red: #CE1126;

    --radius: 10px;
    --radius-lg: 16px;
    --radius-xl: 22px;

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;

    overflow: hidden;

    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

    content: '';
    position: absolute;

    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
  }
