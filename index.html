<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidor de Envíos — New Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────
   Regla del sistema: el único color saturado es el del
   transportista o el de la zona. Todo lo demás es gris.
   ─────────────────────────────────────────────────────────── */
:root{
  --ink:#1c231a; --ink-2:#5b6b57; --ink-3:#889284;
  --rail:#1f4d2e; --rail-2:#173b23; --board:#f1ede0; --paper:#fffdf8;
  --rule:#ddd6c2; --rule-2:#eee9da;
  --hugo:#1c5fd6;   --hugo-bg:#e8f0fe;
  --rueddo:#c8660a; --rueddo-bg:#fbead8;
  --stop:#a13327;   --stop-bg:#f8e6e2;
  --done:#2f6b3f;   --done-bg:#e3efe1;
  --retiro:#7c4fc7; --retiro-bg:#f1eafc;
  --brand-bg:#e6f0e2; --gold:#b9812f; --gold-bg:#f7ecd6;
  --r:6px; --shadow:0 1px 2px rgba(23,31,19,.07),0 4px 16px rgba(23,31,19,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--ink);
  font:400 14px/1.45 'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rail);outline-offset:2px;border-radius:3px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── RAIL ── */
.rail{background:var(--rail);color:#fff;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:52px;flex:none}
.mark{display:flex;align-items:center;gap:8px;font-family:'Archivo Black',sans-serif;font-size:14px;
  letter-spacing:.02em;text-transform:uppercase}
.mark .leaf{flex:none;color:#7fbf8a}
.mark span{color:#a9c3ab;font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  text-transform:none;letter-spacing:.01em;font-size:14px;margin-left:2px}
.rail .file{margin-left:auto;display:flex;align-items:center;gap:9px;color:#c3ccd6;font-size:12px}
.rail .file b{color:#fff;font-weight:500}
.rail .file .sep{color:#4b5764}
.dot-live{width:6px;height:6px;border-radius:50%;background:#39d98a;flex:none}

/* ── MANIFIESTO ── */
.manifest{background:var(--paper);border-bottom:1px solid var(--rule);padding:18px 20px 0;flex:none}
.manifest-top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.count{display:flex;align-items:baseline;gap:9px}
.count b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.count span{font-size:12px;color:var(--ink-2)}
.manifest-top .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.alloc{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--rule-2);gap:2px}
.alloc button{height:100%;transition:filter .15s;min-width:3px}
.alloc button:hover{filter:brightness(1.14)}
.alloc button[data-k=hugo]{background:var(--hugo)}
.alloc button[data-k=rueddo]{background:var(--rueddo)}
.alloc button[data-k=stop]{background:var(--stop)}
.alloc button[data-k=retiro]{background:var(--retiro)}
.alloc button[data-k=none]{background:repeating-linear-gradient(-45deg,#cdd0bd 0 4px,#e6e1cf 4px 8px)}
.legend{display:flex;gap:4px;flex-wrap:wrap;padding:12px 0 0;margin:0 -6px}
.legend button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);
  color:var(--ink-2);font-size:13px;transition:background .12s}
.legend button:hover{background:var(--rule-2)}
.legend button[aria-pressed=true]{background:var(--rule-2);color:var(--ink);font-weight:600}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.sw.hugo{background:var(--hugo)} .sw.rueddo{background:var(--rueddo)}
.sw.stop{background:var(--stop)} .sw.done{background:var(--done)}
.sw.retiro{background:var(--retiro)} .sw.all{background:var(--ink)}
.man{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);
  margin-right:7px;vertical-align:middle;flex:none}
.sw.man{background:var(--gold)}
#e-cps{width:100%;height:150px;border:1px solid var(--rule);border-radius:var(--r);padding:10px 11px;
  font:400 12.5px/1.7 'IBM Plex Mono',monospace;color:var(--ink);resize:vertical}
.ayuda{font-size:12px;color:var(--ink-3);margin:7px 0 12px}
.ayuda b{font-family:'IBM Plex Mono',monospace;color:var(--ink-2)}
.sw.none{background:repeating-linear-gradient(-45deg,#cdd0bd 0 3px,#e6e1cf 3px 6px)}
.legend .n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--ink-3)}
.legend button[aria-pressed=true] .n{color:var(--ink-2)}

/* ── BOTONES ── */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--paper);font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:#f3efe2;border-color:var(--ink-3)}
.btn-primary{background:var(--rail);border-color:var(--rail);color:#fff}
.btn-primary:hover:not(:disabled){background:#252f3b;border-color:#252f3b}
.btn-icon{width:34px;padding:0;justify-content:center}
.btn svg{width:15px;height:15px;flex:none}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── LOTE ── */
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;
  background:var(--rail);color:#fff;flex:none}
.bulk[hidden]{display:none}
.bulk .n{font-weight:600;font-size:13px;margin-right:4px}
.bulk .lbl{color:#9aa6b3;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.bulk .assign{display:flex;gap:6px}
.bulk .assign button{height:30px;padding:0 12px;border-radius:var(--r);font-size:13px;font-weight:600;color:#fff}
.bulk .assign button[data-k=hugo]{background:var(--hugo)}
.bulk .assign button[data-k=rueddo]{background:var(--rueddo)}
.bulk .assign button[data-k=stop]{background:var(--stop)}
.bulk .assign button[data-k=clear]{background:#39434f}
.bulk .assign button:hover{filter:brightness(1.15)}
.bulk .close{margin-left:auto;color:#9aa6b3;padding:6px}
.bulk .close:hover{color:#fff}

/* ── DATOS ── */
.work{flex:1;overflow:auto;padding:14px 20px 96px}
.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r);height:34px;padding:0 11px;width:300px;max-width:100%}
.search input{border:0;outline:0;background:none;font:inherit;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.sel-zona{height:34px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);
  padding:0 9px;font-size:13px}
.chip-obs{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--rule);background:var(--paper);font-size:13px;color:var(--ink-2)}
.chip-obs[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:2;background:#f7f4e9;border-bottom:1px solid var(--rule);
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);
  text-align:left;padding:9px 12px;white-space:nowrap}
tbody td{border-bottom:1px solid var(--rule-2);padding:9px 12px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:#f7f4e9}
tbody tr.is-active{background:#eef3f8;box-shadow:inset 3px 0 0 var(--ink)}
tbody tr.is-sel{background:var(--brand-bg)}
tbody tr.is-sel:hover{background:#d9ead4}
tbody tr.is-retiro td{background:#faf7ff}
tbody tr.is-done{opacity:.5}
tbody tr.is-done:hover{opacity:.9}
tbody tr.is-done.is-sel{opacity:.75}
.pend{color:var(--done);margin-right:6px;display:inline-flex;vertical-align:middle}
.pend svg{width:13px;height:13px}
.c-check{width:38px} .c-asig{width:186px} .c-zona{width:86px} .c-est{width:96px}
.trk{font-weight:600;font-size:13px;display:block}
.dest{font-weight:500}
.sub{color:var(--ink-2);font-size:12.5px}
.addr{max-width:290px}
.addr .l1{font-size:13px}
.addr .l2{color:var(--ink-3);font-size:12px;margin-top:2px;display:flex;gap:5px;align-items:flex-start}
.addr .l2 svg{width:12px;height:12px;flex:none;margin-top:2px}
.addr .l2.alerta{color:#8a6100;font-weight:500}
.cp{font-size:12.5px;color:var(--ink-2)}

input[type=checkbox]{appearance:none;width:16px;height:16px;border:1.5px solid var(--rule);border-radius:3px;
  background:var(--paper);cursor:pointer;display:grid;place-content:center;margin:0}
input[type=checkbox]:hover{border-color:var(--ink-3)}
input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
input[type=checkbox]:checked::after{content:'';width:9px;height:5px;border:2px solid #fff;
  border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
input[type=checkbox]:disabled{opacity:.3;cursor:not-allowed}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 11px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);
  border-right:1px solid var(--rule);transition:background .1s,color .1s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--rule-2)}
.seg button[aria-pressed=true][data-k=hugo]{background:var(--hugo);color:#fff}
.seg button[aria-pressed=true][data-k=rueddo]{background:var(--rueddo);color:#fff}
.seg button[aria-pressed=true][data-k=stop]{background:var(--stop);color:#fff}

.tag{display:inline-block;padding:2.5px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.03em}
.tag.nuevo{background:var(--rule-2);color:var(--ink-2)}
.tag.proc{background:var(--done-bg);color:var(--done)}
.tag.rep{background:#fdf3d9;color:#8a6100}
.tag.retiro{background:var(--retiro-bg);color:var(--retiro)}
.zona{display:inline-block;padding:2.5px 8px;border-radius:4px;font-size:11px;font-weight:600;
  letter-spacing:.05em;background:var(--rule-2);color:var(--ink-2);cursor:pointer}
.zona:hover{background:var(--rule)}
.zona.RETIRO{background:var(--retiro-bg);color:var(--retiro)}
.flag{display:inline-block;margin-top:4px;margin-right:4px;padding:1.5px 6px;border-radius:3px;
  font-size:10px;font-weight:600;letter-spacing:.04em;background:var(--stop-bg);color:var(--stop)}

/* ── VACÍO / DROP ── */
.empty{background:var(--paper);border:1px dashed var(--rule);border-radius:var(--r);
  padding:64px 24px;text-align:center;transition:border-color .15s,background .15s}
.empty.over{border-color:var(--rail);background:var(--brand-bg)}
.empty h2{font-size:17px;font-weight:600;margin:0 0 6px}
.empty p{color:var(--ink-2);margin:0 0 20px;font-size:13.5px}

/* ── PIE ── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);
  border-top:1px solid var(--rule);padding:11px 20px;display:flex;align-items:center;gap:9px;
  flex-wrap:wrap;box-shadow:0 -1px 12px rgba(16,21,27,.05)}
.foot .hint{margin-left:auto;color:var(--ink-3);font-size:11.5px;display:flex;gap:12px;align-items:center}
kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--rule-2);border:1px solid var(--rule);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.foot-lbl{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-right:2px}
.foot .btn.vacio{opacity:.55}
.foot .btn.vacio:hover{opacity:1}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink-2);
  line-height:1.4;margin:4px 0 14px;cursor:pointer}
.chk input{margin-top:1px;flex:none}
.prev{background:#f3efe2;border:1px solid var(--rule-2);border-radius:var(--r);padding:10px 12px;
  font-size:12.5px;color:var(--ink-2)}
.prev b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;word-break:break-all}
/* ── ETIQUETAS DE RETIRO ────────────────────────────────────
   La etiqueta se pega al paquete que queda en el local. Lo único
   que importa es que el del mostrador encuentre el paquete cuando
   la persona llega y dice su nombre: por eso el nombre es lo grande.
   ─────────────────────────────────────────────────────────── */
.foot-sep{width:1px;height:22px;background:var(--rule);margin:0 3px}
.hoja{display:none}
.etq{background:#fff;color:#000;display:flex;flex-direction:column;justify-content:center;
  font-family:'Archivo',sans-serif;break-inside:avoid;box-sizing:border-box}
.etq.rot{padding:0;position:relative;overflow:hidden}
.etq-in{position:absolute;top:50%;left:50%;box-sizing:border-box;
  transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center center;
  display:flex;flex-direction:column;justify-content:center}
.etq-top{font-size:9pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  border-bottom:1.5pt solid #000;padding-bottom:2mm;margin-bottom:4mm}
.etq-nom{font-family:'Archivo Black',sans-serif;line-height:1.05;
  word-break:break-word;hyphens:auto;margin-bottom:3mm}
.etq-cod{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.05em}
.etq-pie{display:flex;justify-content:space-between;gap:4mm;margin-top:auto;padding-top:3mm;
  border-top:.6pt solid #999;font-size:8.5pt;color:#333}

/* previsualización en pantalla, escalada */
.prevetq{background:var(--rule-2);border-radius:var(--r);padding:14px;display:grid;place-items:center;
  margin-bottom:14px;overflow:hidden}
.prevetq .etq{box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid var(--rule)}
.lista-etq{border:1px solid var(--rule-2);border-radius:var(--r);max-height:190px;overflow:auto}
.lista-etq label{display:flex;align-items:center;gap:10px;padding:8px 11px;font-size:13px;
  border-bottom:1px solid var(--rule-2);cursor:pointer}
.lista-etq label:last-child{border-bottom:0}
.lista-etq label:hover{background:#f7f4e9}
.lista-etq label.hecha{color:var(--ink-3);background:#faf7ee}
.lista-etq label.hecha:hover{background:#f2f4f6}
.lista-etq .t{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3);margin-left:auto}
.lista-etq .ya{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--rule-2);
  padding:1.5px 7px;border-radius:20px;margin-left:auto}
.tag.imp{background:var(--done-bg);color:var(--done)}
.tag.bultos{background:#e8f0fe;color:var(--hugo);margin-left:4px}
.bultos-ctl{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);font-weight:600}
.bultos-ctl input{width:42px;height:24px;border:1px solid var(--rule);border-radius:4px;
  text-align:center;font:600 12px 'IBM Plex Mono',monospace;color:var(--ink);background:var(--paper)}
.bultos-ctl input:focus{border-color:var(--rail);outline:none}

.btn-row{display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.btn-mini{height:24px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:600;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink-2)}
.btn-mini:hover{background:var(--rule-2);color:var(--ink)}
.btn-mini.rev{border-color:#c9b8a0;color:#8a6100}
.btn-mini.rev:hover{background:#fdf3d9}
.btn-mini.dl{border-color:var(--rail);color:var(--rail)}
.btn-mini.dl:hover{background:var(--brand-bg)}
.btn-prep{background:var(--rail-2);border-color:var(--rail-2);color:#fff;font-weight:600;
  height:38px;padding:0 18px;font-size:13.5px}
.btn-prep:hover:not(:disabled){background:var(--rail);border-color:var(--rail)}
.btn-prep .n{font-family:'IBM Plex Mono',monospace;opacity:.85;margin-left:4px}


@media print{
  body>*{display:none!important}
  body>#hoja{display:block!important}
  body{background:#fff;margin:0}
  .etq{page-break-after:always}
  .etq:last-child{page-break-after:auto}
  .hoja.a4{display:grid!important;grid-template-columns:1fr 1fr;gap:0}
  .hoja.a4 .etq{page-break-after:auto;border:.4pt dashed #bbb;height:66mm}
}
.exp{position:relative;padding-left:26px}
.exp::before{content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:2px}
.exp.hugo::before{background:var(--hugo)} .exp.rueddo::before{background:var(--rueddo)}
.exp .n{font-family:'IBM Plex Mono',monospace;color:#9fb4d8;font-weight:500}

/* ── MENÚ / MODAL ── */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:var(--shadow);min-width:230px;padding:5px;z-index:20}
.menu[hidden]{display:none}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:4px;
  font-size:13px;text-align:left}
.menu button:hover{background:var(--rule-2)}
.menu button.danger{color:var(--stop)}
.menu button.danger:hover{background:var(--stop-bg)}
.menu hr{border:0;border-top:1px solid var(--rule-2);margin:5px 0}

.veil{position:fixed;inset:0;background:rgba(16,21,27,.45);z-index:40;display:grid;place-items:center;padding:20px}
.veil[hidden]{display:none}
.modal{background:var(--paper);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%;max-width:460px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.modal header{padding:18px 20px 0;flex:none}
.modal h3{margin:0 0 5px;font-size:16px;font-weight:600}
.modal p{margin:0;color:var(--ink-2);font-size:13px}
.modal .body{padding:16px 20px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;
  border-top:1px solid var(--rule-2);background:#faf7ee;flex:none}
.rule-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.rule-row:last-child{border-bottom:0}
.rule-row .z{width:74px;flex:none}
.rule-row .cnt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3)}
.field{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--ink-2);width:132px;flex:none}
.field input{flex:1;height:34px;border:1px solid var(--rule);border-radius:var(--r);padding:0 10px;
  font:inherit;color:var(--ink)}
.field input[type=number]{flex:none;width:88px}
.field .sub{font-size:12px;color:var(--ink-3)}

.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:60;background:var(--rail);
  color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);max-width:90vw}
.toast[hidden]{display:none}

@media (max-width:900px){
  .work{padding:12px 12px 130px}
  .manifest{padding:14px 12px 0}
  .count b{font-size:24px}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;padding:12px;
    border-bottom:1px solid var(--rule-2)}
  tbody td{border:0;padding:0}
  .c-check{grid-row:1/6;align-self:start;padding-top:2px}
  .c-zona{grid-row:1;grid-column:3;text-align:right}
  .c-trk{grid-column:2} .c-dest{grid-column:2;padding-bottom:2px}
  .c-cp,.c-tel{display:none}
  .c-addr{grid-column:2/4;padding-bottom:9px}
  .addr{max-width:none}
  .c-asig{grid-column:2/4} .c-est{grid-column:2/4;padding-top:8px}

<script>
'use strict';
const $=s=>document.querySelector(s);
const KEYS={hugo:'Hugo',rueddo:'Rueddo',stop:'No enviar'};
const CP_RETIRO=9989;                     // LightData usa este CP para "retiro en la web"

/* ── ALMACENAMIENTO (tolera navegadores sin localStorage) ── */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};

/* ── GOOGLE SHEETS (Apps Script) ───────────────────────────
   Fuente compartida entre las 2 PCs. localStorage sigue como
   caché local por si no hay internet un momento.
   ─────────────────────────────────────────────────────────── */
const API_URL='https://script.google.com/macros/s/AKfycbzplhXcmom4WKgpVmA4V61QZR7dOBrBa8hsseykKbKybLHkBg0RYgwEiLS6eY6NrTDpoQ/exec';
let SHEET_ESTADO={};      // tracking normalizado -> {asignacion, procesado, bultos}
let SHEET_CONTADORES={};  // { hugo:{fecha:n}, rueddo:{fecha:n} }
let SHEET_OK=false;
// Misma clave en todas las PCs: sin ceros a la izquierda ni sufijo de bulto
const trkKey=t=>String(t||'').replace(/^0+/,'').replace(/-\d+$/,'').trim()||String(t||'');

async function sheetLoad(){
  try{
    const r=await fetch(API_URL+'?action=load');
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'error');
    SHEET_ESTADO={};
    (j.estado||[]).forEach(row=>{
      const t=trkKey(row.tracking);
      if(!t) return;
      const prev=SHEET_ESTADO[t]||{};
      const proc=String(row.procesado)==='1'||row.procesado===1||row.procesado===true;
      SHEET_ESTADO[t]={
        asignacion: row.asignacion||prev.asignacion||'',
        // si cualquier registro dice procesado, queda procesado
        procesado: proc || !!prev.procesado,
        bultos: Math.max(1, Number(row.bultos)||prev.bultos||1)
      };
    });
    SHEET_CONTADORES=j.contadores||{};
    SHEET_OK=true;
    return true;
  }catch(err){
    console.warn('Sheet load failed', err);
    SHEET_OK=false;
    return false;
  }
}

function sheetPost(body){
  // text/plain evita preflight CORS problemático con Apps Script
  return fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  }).then(r=>r.json()).catch(err=>{
    console.warn('Sheet post failed', err);
    return {ok:false,error:String(err)};
  });
}

function sheetUpsert(items){
  if(!items.length) return Promise.resolve();
  return sheetPost({action:'upsert', items});
}

function sheetSetNum(logistica, fecha, numero){
  return sheetPost({action:'setNum', logistica, fecha, numero:Number(numero)||0});
}

/* ── ZONAS POR CÓDIGO POSTAL ────────────────────────────────
   La localidad la escribe el cliente y viene inconsistente
   ("Caba", "Bsas", "Capital Federal"...). El CP es confiable.
   Ajustá estos rangos a tu operación real.
   ─────────────────────────────────────────────────────────── */
const ZONAS=[
  {id:'RETIRO',test:n=>n===CP_RETIRO},
  {id:'CABA',  test:n=>n>=1000&&n<=1499},
  {id:'NORTE', test:n=>n>=1600&&n<=1670},
  {id:'OESTE', test:n=>(n>=1671&&n<=1699)||(n>=1700&&n<=1772)},
  {id:'SUR',   test:n=>n>=1804&&n<=1999},
];
const zonaDe=cp=>{const n=parseInt(cp,10);if(isNaN(n))return 'S/D';
  const z=ZONAS.find(z=>z.test(n));return z?z.id:'OTRA'};

/* ── REPARTO POR CÓDIGO POSTAL ──────────────────────────────
   La regla real: Hugo se lleva una lista fija de CPs de Capital,
   todo el resto va a Rueddo, y los retiros no salen a la calle.
   Ojo: "de Capital" no alcanza como criterio. Barracas (1268),
   1295 y Floresta (1406) son CABA y los lleva Rueddo. Por eso
   manda la lista, no la zona.
   Se edita desde el menú; no hace falta tocar el código.
   ─────────────────────────────────────────────────────────── */
const CP_HUGO_TXT=`1001-1062 1067 1068 1079-1097
1104 1106-1107 1110-1129
1170-1177 1179-1198
1200-1204 1207 1209-1215 1223-1224
1405 1414 1419 1425-1431`;
/* Nota: 1870, 1878 y 1879 NO van en esta lista.
   Son excepción Sur: solo Hugo vie ≥13:00 → sáb <08:00.
   Este archivo de LightData no trae hora, así que esos 3 se asignan a mano cuando corresponda. */
function expandir(txt){
  const s=new Set();
  String(txt).split(/[^\d-]+/).filter(Boolean).forEach(p=>{
    const m=p.match(/^(\d+)-(\d+)$/);
    if(m){const a=+m[1],b=+m[2]; for(let n=Math.min(a,b);n<=Math.max(a,b);n++)s.add(n)}
    else if(/^\d+$/.test(p)) s.add(+p);
  });
  return s;
}
let CP_HUGO=expandir(store.get('ng.cphugo',CP_HUGO_TXT));
function repartidor(cp){
  const n=parseInt(cp,10);
  if(isNaN(n)) return null;                    // sin CP no se puede decidir
  if(n===CP_RETIRO) return 'stop';
  return CP_HUGO.has(n)?'hugo':'rueddo';
}

/* ── LIMPIEZA DE TEXTO ── */
const VACIO=v=>{const s=(v==null?'':String(v)).trim();return (s===''||s==='-')?'':s};
const esp=s=>s.replace(/\s+/g,' ').trim();
const titulo=s=>{
  if(!s) return s;
  if(s!==s.toUpperCase()&&s!==s.toLowerCase()) return s;   // ya viene con mayúsculas mixtas
  return s.toLowerCase().replace(/(^|[\s(/-])([a-záéíóúñ])/g,(m,a,b)=>a+b.toUpperCase());
};
const limpiarDir=s=>esp(s).replace(/(\s+0)+$/,'').trim();   // saca el " 0 0" de piso/depto vacíos
const RX_INSTR=/porter[ií]a|timbre|llamar|avisar|mensaje|dejar en|encargad|no hay nadie|coordinar|whatsapp/i;

/* ── PARSER CSV (respeta comillas, detecta ; o ,) ── */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const nl=text.indexOf('\n'), head=text.slice(0,nl<0?text.length:nl);
  const delim=(head.split(';').length>head.split(',').length)?';':',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

/* ── MAPEO DE COLUMNAS (tolera cambios de orden o de nombre) ── */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const CAMPOS={
  t:['numerodetracking','tracking','nrodetracking','numerodeenvio','guia'],
  fecha:['fechadeventa','fecha'],
  d:['destinatario','nombre','cliente'],
  tel:['telefonodecontacto','telefono','celular'],
  dir:['direccion','domicilio'],
  loc:['localidad','ciudad'],
  cp:['codigopostal','cp','codpostal'],
  obs:['observaciones','observacion','notas'],
  mail:['email','correo','mail'],
  cobrar:['4totalacobrar','totalacobrar','acobrar','contrareembolso'],
  inv:['1logisticainversa','logisticainversa','inversa','cambio'],
  peso:['pesodeclarado','peso'],
  valor:['valordeclarado','valor'],
};
function mapear(headers){
  const H=headers.map(norm), idx={};
  for(const [k,alias] of Object.entries(CAMPOS)){
    let i=H.findIndex(h=>alias.includes(h));
    if(i<0) i=H.findIndex(h=>alias.some(a=>h.includes(a)));
    idx[k]=i;
  }
  return idx;
}

/* ── ESTADO ── */
const S={rows:[],hdr:[],idx:{},filter:'todos',zona:'',q:'',obs:false,sel:new Set(),act:null,file:'',fecha:''};
const hoy=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`};

function construir(matrix){
  const idx=mapear(matrix[0]);
  if(idx.t<0){toast('No encontré la columna de tracking. ¿Es el archivo de LightData?');return}
  const mem=store.get('ng.asig',{}), proc=store.get('ng.proc',{}), imp=store.get('ng.imp',{});
  const vistos=new Set();
  S.hdr=matrix[0].map(h=>String(h==null?'':h).trim());
  S.idx=idx;
  S.rows=matrix.slice(1).map((r,i)=>{
    const g=k=>idx[k]>=0?VACIO(r[idx[k]]):'';
    const t=g('t'), cp=g('cp'), obs=esp(g('obs'));
    const z=zonaDe(cp);
    const dup=vistos.has(t); vistos.add(t);
    const base=repartidor(cp);
    const ov=Object.prototype.hasOwnProperty.call(mem,t)?mem[t]:undefined;
    return {
      i, t,
      raw:S.hdr.map((h,c)=>r[c]==null?'':String(r[c]).trim()),   // lo que se exporta, sin tocar
      d:titulo(esp(g('d'))),
      tel:g('tel'),
      dir:titulo(limpiarDir(g('dir'))),
      loc:titulo(esp(g('loc'))),
      cp, z, obs,
      instr:RX_INSTR.test(obs),
      mail:g('mail'),
      cobrar:g('cobrar'),
      inv:g('inv'),
      base, k: ov===undefined ? base : (ov||null),
      proc: !!proc[t],
      imp: !!imp[t],
      dup
    };
  });
  S.fecha=S.rows.length?(matrix[1][idx.fecha]||'').trim():'';
  // Bultos / procesado / asignación: Sheet manda en procesado y bultos
  const bultosMem=store.get('ng.bultos',{});
  S.rows.forEach(r=>{
    r.bultos = Math.max(1, Number(bultosMem[r.t])||1);
    const sh=SHEET_ESTADO[trkKey(r.t)];
    if(sh){
      if(sh.bultos) r.bultos=sh.bultos;
      if(sh.procesado) r.proc=true;          // nunca bajar procesado del Sheet
      if(sh.asignacion && !Object.prototype.hasOwnProperty.call(mem,r.t)){
        r.k = sh.asignacion || null;
      }
    }
  });
  // al cargar, se tildan solos los pendientes (no procesados)
  S.sel=new Set(S.rows.filter(r=>r.z!=='RETIRO'&&(r.k==='hugo'||r.k==='rueddo')&&!r.proc).map(r=>r.i));
  S.act=null;
  llenarZonas();
  // No hacemos guardar() completo al cargar: evitaría pisar el Sheet de la otra PC
  // Solo cache local
  const _mem={},_proc={},_imp={},_bultos={};
  S.rows.forEach(r=>{
    if(r.k!==r.base)_mem[r.t]=r.k||'';
    if(r.proc)_proc[r.t]=1;
    if(r.imp)_imp[r.t]=1;
    if(r.bultos>1)_bultos[r.t]=r.bultos;
  });
  store.set('ng.asig',_mem); store.set('ng.proc',_proc); store.set('ng.imp',_imp); store.set('ng.bultos',_bultos);
  render();
  const c=counts(), sin=S.rows.filter(r=>!r.k&&r.z!=='RETIRO').length;
  toast(`${S.rows.length} envíos repartidos: ${c.hugo} a Hugo, ${c.rueddo} a Rueddo, ${c.retiro} a retirar`
    +(sin?` · ${sin} sin CP válido, revisalos`:'')
    +(SHEET_OK?' · sincronizado con Sheet':' · Sheet offline, usando memoria local'));
}
function guardar(){
  const mem={},proc={},imp={},bultos={};
  // solo se guarda lo que difiere del reparto automático
  S.rows.forEach(r=>{
    if(r.k!==r.base)mem[r.t]=r.k||'';
    if(r.proc)proc[r.t]=1;
    if(r.imp)imp[r.t]=1;
    if(r.bultos>1) bultos[r.t]=r.bultos;
  });
  store.set('ng.asig',mem); store.set('ng.proc',proc); store.set('ng.imp',imp);
  store.set('ng.bultos',bultos);
  // Sincroniza al Sheet (fire-and-forget)
  if(S.rows.length){
    const items=S.rows.map(r=>({
      tracking: trkKey(r.t),           // clave estable entre PCs
      asignacion:r.k||'',
      procesado:!!r.proc,
      bultos:r.bultos||1
    }));
    sheetUpsert(items);
  }
}

/* ── LECTURA DE ARCHIVO (carga manual, botón "Cargar archivo") ── */
function leer(file){
  S.file=file.name;
  const ext=file.name.split('.').pop().toLowerCase();
  const rd=new FileReader();
  rd.onload=async e=>{
    try{
      toast('Sincronizando con Google Sheet…');
      await sheetLoad();
      if(ext==='csv'){ construir(parseCSV(e.target.result)); }
      else if(typeof XLSX!=='undefined'){
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        construir(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
      } else {
        toast('No se pudo leer el .xlsx. Guardalo como CSV y volvé a cargarlo.');
      }
    }catch(err){ toast('El archivo no se pudo leer: '+err.message); }
  };
  ext==='csv' ? rd.readAsText(file,'utf-8') : rd.readAsArrayBuffer(file);
}

/* ── CARGA AUTOMÁTICA DESDE EL REPO ─────────────────────────
   Un GitHub Action baja el CSV del FTP y lo commitea en
   /data/envioslightdata.csv cada 10 min. Esta función lo busca
   y lo procesa igual que si se hubiera cargado a mano.
   No reemplaza la carga manual: conviven las dos.
   ─────────────────────────────────────────────────────────── */
const DATA_URL='./data/envioslightdata.csv';
async function cargarDesdeURL(silencioso){
  try{
    if(!silencioso) toast('Buscando el archivo actualizado…');
    const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const text=await r.text();
    S.file='envioslightdata.csv (automático)';
    await sheetLoad();
    construir(parseCSV(text));
  }catch(err){
    console.warn('Auto-carga falló', err);
    if(!silencioso) toast('No encontré el archivo automático todavía. Podés cargarlo a mano mientras tanto.');
  }
}

/* ── RENDER ── */
function counts(){
  const c={hugo:0,rueddo:0,stop:0,none:0,retiro:0,proc:0};
  S.rows.forEach(r=>{
    if(r.z==='RETIRO') c.retiro++;
    else c[r.k||'none']++;
    if(r.proc) c.proc++;
  });
  return c;
}
function visible(){
  const q=S.q.toLowerCase();
  return S.rows.filter(r=>{
    if(S.filter==='retiro'&&r.z!=='RETIRO')return false;
    if(['hugo','rueddo','stop'].includes(S.filter)&&(r.k!==S.filter||r.z==='RETIRO'))return false;
    if(S.filter==='none'&&(r.k||r.z==='RETIRO'))return false;
    if(S.filter==='proc'&&!r.proc)return false;
    if(S.filter==='man'&&r.k===r.base)return false;
    if(S.zona&&r.z!==S.zona)return false;
    if(S.obs&&!r.instr)return false;
    if(q&&!(r.t+r.d+r.dir+r.loc+r.cp).toLowerCase().includes(q))return false;
    return true;
  });
}
function llenarZonas(){
  const z=[...new Set(S.rows.map(r=>r.z))].sort();
  $('#zsel').innerHTML='<option value="">Todas las zonas</option>'+
    z.map(x=>`<option value="${x}">${x} (${S.rows.filter(r=>r.z===x).length})</option>`).join('');
  $('#zsel').value=S.zona;
}
function renderHead(){
  const c=counts(), tot=S.rows.length;
  $('#total').textContent=tot;
  $('#totlbl').textContent=tot===1?'envío':'envíos';
  $('#railfile').innerHTML = S.file
    ? `<span class="dot-live"></span><span>Archivo</span><b class="mono">${S.file}</b>`+
      (S.fecha?`<span class="sep">·</span><span>ventas del</span><b class="mono">${S.fecha}</b>`:'')
    : '<span>Sin archivo cargado</span>';
  // el número del botón es lo que falta descargar, no lo ya procesado
  const nH=S.rows.filter(r=>r.k==='hugo'&&r.z!=='RETIRO'&&!r.proc).length;
  const nR=S.rows.filter(r=>r.k==='rueddo'&&r.z!=='RETIRO'&&!r.proc).length;
  $('#n-hugo').textContent=nH;

/* ── EXPORTAR ───────────────────────────────────────────────
   El Excel final es el archivo de LightData tal cual: mismas 13
   columnas, mismo orden, hoja "Simple". Cambios sobre el crudo:
     · Numero de tracking  se le sacan los ceros de adelante
     · Fecha de venta      dd-mm-aaaa  →  d/m/aaaa
     · Localidad           CP de Capital → "CABA"; el resto, Tipo Título
     · Celda vacía         →  "-"
   Todo lo demás va literal. Las limpiezas de texto de la tabla
   (dirección, nombre) son solo de pantalla y nunca se exportan.
   ─────────────────────────────────────────────────────────── */
const LOC_CABA='CABA';
// en castellano los conectores van en minúscula: "Belen de Escobar", "Lomas del Mirador"
const MINUS=new Set(['de','del','la','las','los','el','y','e','en','a','al']);
function tituloLoc(s){
  return esp(s).toLowerCase().replace(/([a-záéíóúüñ0-9]+)/g,
    (w,_p,off)=>(off>0&&MINUS.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1));
}
function fechaSalida(v){
  const m=String(v||'').match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/);
  return m?`${+m[1]}/${+m[2]}/${m[3]}`:(v||'-');
}
/* Teléfono de salida: siempre 10 dígitos en formato número.
   - Si tiene más de 10 → se quedan los últimos 10 (se borra el prefijo de más).
   - Si tiene 8 → se antepone 11 (celulares AMBA sin el 11).
   - Si tiene 9 o menos (salvo 8) o no es numérico → se deja lo que se pueda. */
function normalizarTel(v){
  let d=String(v==null?'':v).replace(/\D/g,'');  // solo dígitos
  if(!d) return '';
  if(d.length>10) d=d.slice(-10);                 // más de 10 → últimos 10
  if(d.length===9) d='1'+d;                       // 9 dígitos → se antepone 1
  if(d.length===8) d='11'+d;                      // 8 dígitos → prefijo 11
  return d;
}
function filaExport(r,fechaFija){
  return S.hdr.map((h,c)=>{
    let v=r.raw[c]==null?'':String(r.raw[c]).trim();
    if(c===S.idx.t)     v=v.replace(/^0+/,'')||v;      // 000194901 → 194901
    if(c===S.idx.fecha) v=fechaSalida(fechaFija||v);
    if(c===S.idx.loc)   v=(r.z==='CABA')?LOC_CABA:tituloLoc(v);
    if(c===S.idx.tel)   v=normalizarTel(v);
    return (v===''||v==='-')?'-':v;
  });
}
function libro(rows,fechaFija){
  const ws=XLSX.utils.aoa_to_sheet([S.hdr.slice(),...rows.map(r=>filaExport(r,fechaFija))]);
  rows.forEach((_,i)=>{
    // tracking y CP como texto, para no perder los ceros iniciales
    [S.idx.t,S.idx.cp].forEach(c=>{
      if(c<0)return; const cell=ws[XLSX.utils.encode_cell({r:i+1,c})];
      if(cell){cell.t='s';cell.z='@'}
    });
    // teléfono siempre como número de 10 dígitos (sin notación científica)
    if(S.idx.tel>=0){
      const cell=ws[XLSX.utils.encode_cell({r:i+1,c:S.idx.tel})];
      if(cell){
        const d=normalizarTel(cell.v);
        if(d && /^\d+$/.test(d)){
          cell.t='n';
          cell.v=Number(d);
          cell.z='0';           // formato entero, sin decimales
        } else {
          cell.t='s';
          cell.v=d||'-';
        }
      }
    }
  });
  ws['!cols']=S.hdr.map((h,c)=>({wch:Math.max(h.length,...rows.map(r=>String(r.raw[c]||'').length))+3}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Simple');   // la página de etiquetas espera esta hoja
  return wb;
}
/* Expande una orden en N filas de bultos.
   Tracking base "196992" o "196992-1" → 196992-1, 196992-2, 196992-3...
   Si ya trae sufijo -N, se respeta el número base. */
function expandBultos(rows){
  const out=[];
  rows.forEach(r=>{
    const n=Math.max(1, Number(r.bultos)||1);
    const t0=String(r.t||'').replace(/-\d+$/,'');  // saca sufijo existente
    for(let i=1;i<=n;i++){
      const clone={...r, raw:r.raw.slice()};
      const track = n===1 ? String(r.t) : `${t0}-${i}`;
      // actualiza tracking en raw (columna de tracking)
      if(S.idx.t>=0) clone.raw[S.idx.t]=track;
      clone.t=track;
      clone._bulto=i;
      clone._bultosTotal=n;
      out.push(clone);
    }
  });
  return out;
}
function bajar(rows,archivo,fechaFija,etiqueta){
  if(typeof XLSX==='undefined'){
    toast('No cargó la librería de Excel. Recargá la página con internet: la web de etiquetas necesita .xlsx, no CSV.');
    return;
  }
  const expandidas=expandBultos(rows);
  XLSX.writeFile(libro(expandidas,fechaFija),archivo);
  rows.forEach(r=>r.proc=true); guardar(); render();
  const extra=expandidas.length-rows.length;
  toast(`${etiqueta}: ${rows.length} orden${rows.length===1?'':'es'} → ${expandidas.length} bulto${expandidas.length===1?'':'s'}`+
    (extra?` (+${extra} extra)`:'')+' · marcados como procesados');
}
/* Contadores independientes por logística y por fecha de archivo.
   Hugo 03-09-2026 → 1,2,3...   Rueddo 03-09-2026 → 1,2,3...
   Cambiar la fecha reinicia la sugerencia para esa fecha. */
function numSugerido(logistica, fecha){
  const f0 = fecha || hoy();
  // Prioridad: Sheet compartido > localStorage
  const fromSheet = (SHEET_CONTADORES[logistica]||{})[f0];
  const mem = store.get('ng.archivo', {});
  const fromLocal = (mem[logistica]||{})[f0];
  const ult = Math.max(Number(fromSheet)||0, Number(fromLocal)||0);
  return {f0, nSug: ult+1, ult};
}
function guardarNum(logistica, fecha, n){
  const mem = store.get('ng.archivo', {});
  if(!mem[logistica]) mem[logistica] = {};
  mem[logistica][fecha] = n;
  store.set('ng.archivo', mem);
  // Actualiza caché en memoria y Sheet
  if(!SHEET_CONTADORES[logistica]) SHEET_CONTADORES[logistica]={};
  SHEET_CONTADORES[logistica][fecha]=n;
  sheetSetNum(logistica, fecha, n);
}
function exportar(k,nombre,preseleccion){
  if(!S.rows.length){toast('Cargá el archivo de LightData primero');return}
  const todos=S.rows.filter(r=>r.k===k&&r.z!=='RETIRO');
  if(!todos.length){
    toast(`Todavía no hay envíos asignados a ${nombre}. Asignalos y volvé a intentar.`);
    return;
  }
  // memoria: lo ya descargado (r.proc) no se vuelve a tildar solo;
  // se ve en la lista pero gris y destildado, para no duplicarlo en la próxima tanda
  // Si viene preseleccion (sacar individual), se fuerza ese/esos aunque estén procesados
  const forzados=preseleccion?new Set(preseleccion):null;
  const pend=todos.filter(r=>!r.proc || (forzados&&forzados.has(r.i)));
  const ya=todos.filter(r=>r.proc && !(forzados&&forzados.has(r.i)));
  const sinAsig=S.rows.filter(r=>!r.k&&r.z!=='RETIRO').length;
  const {f0,nSug,ult}=numSugerido(k);
  modal(`Descargar Excel de ${nombre}`,
    `${pend.length} pendientes de esta tanda`+
    (ya.length?` · ${ya.length} ya procesados, quedan destildados`:'')+
    (sinAsig?` · ${sinAsig} sin asignar no entran`:''),
    `<div class="field"><label for="e-fecha">Fecha del archivo</label>
       <input id="e-fecha" type="text" value="${f0}" placeholder="dd-mm-aaaa"></div>
     <div class="field"><label for="e-num">Número de archivo</label>
       <input id="e-num" type="number" min="1" step="1" value="${nSug}">
       <span class="sub" id="e-num-hint" style="flex:none">${ult?`último de esta fecha (${nombre}): ${ult}`:`primero de ${nombre} en esta fecha`}</span></div>
     <label class="chk"><input type="checkbox" id="e-rep">
       Reemplazar «Fecha de venta» de todas las filas por esa fecha</label>
     <div class="lista-etq" id="e-lista-exp">${[...pend,...ya].map(r=>{
       const tildado=forzados?forzados.has(r.i):!r.proc;
       const esYa=r.proc&&!(forzados&&forzados.has(r.i));
       return `<label class="${esYa?'hecha':''}"><input type="checkbox" data-exp="${r.i}" ${tildado?'checked':''}>
         <span>${esc(r.d)}${r.bultos>1?` <span class="tag bultos">${r.bultos} bultos</span>`:''}</span>
         ${esYa?'<span class="ya">Ya procesado</span>':`<span class="t">${esc(trkCorto(r.t))}</span>`}</label>`;
     }).join('')}</div>
     <div class="prev">Se descargan <b id="e-cant">${pend.length}</b> órdenes (<b id="e-bultos">${pend.reduce((s,r)=>s+(r.bultos||1),0)}</b> bultos) → <b id="e-nom"></b> · hoja <b>Simple</b></div>`,
    'Descargar y marcar',()=>{
      const sel=[...document.querySelectorAll('[data-exp]:checked')].map(c=>S.rows[+c.dataset.exp]);
      if(!sel.length){toast('No tildaste ningún envío para descargar');return}
      const f=$('#e-fecha').value.trim()||f0;
      const nd=Number($('#e-num').value.trim())||nSug;
      guardarNum(k, f, nd);
      bajar(sel,`${nombre.toUpperCase()}_${f}_${nd}.xlsx`,
        $('#e-rep').checked?f:'',nombre);
    });
  const pinta=()=>{
    const f=$('#e-fecha').value.trim()||f0, nd=$('#e-num').value.trim();
    $('#e-nom').textContent=`${nombre.toUpperCase()}_${f}_${nd||nSug}.xlsx`;
  };
  const alCambiarFecha=()=>{
    const f=$('#e-fecha').value.trim()||f0;
    const s=numSugerido(k, f);
    $('#e-num').value=s.nSug;
    const hint=$('#e-num-hint');
    if(hint) hint.textContent=s.ult?`último de esta fecha (${nombre}): ${s.ult}`:`primero de ${nombre} en esta fecha`;
    pinta();
  };
  const cant=()=>{
    const ids=[...document.querySelectorAll('[data-exp]:checked')].map(c=>+c.dataset.exp);
    $('#e-cant').textContent=ids.length;
    const b=ids.reduce((s,i)=>s+(S.rows[i].bultos||1),0);
    const eb=$('#e-bultos'); if(eb) eb.textContent=b;
  };
  $('#e-fecha').oninput=alCambiarFecha; $('#e-num').oninput=pinta; pinta();
  $('#e-lista-exp').addEventListener('change',cant);
}

/* ── ETIQUETAS DE RETIRO ────────────────────────────────────
   Para los pedidos que el cliente pasa a buscar. No van a ningún
   Excel: se imprime una etiqueta por paquete con el nombre grande,
   se pega, y queda en el estante hasta que la persona llega.
   ─────────────────────────────────────────────────────────── */
const FORMATOS={
  // en 10x15 el nombre va girado 90°: el largo del papel pasa a ser el ancho
  // del renglón, así entra mucho más grande y no queda medio rollo en blanco
  t10x15:{lbl:'Térmica 10 × 15 cm, nombre apaisado', page:'100mm 150mm',
          w:100,h:150, rot:true,  cw:150,ch:100, pad:12, lineas:2, min:26,max:66,
          top:'12pt', cod:'20pt', pie:'11pt'},
  t10x5 :{lbl:'Térmica 10 × 5 cm', page:'100mm 50mm',
          w:100,h:50,  rot:false, cw:100,ch:50,  pad:5,  lineas:2, min:12,max:22,
          top:'8pt',  cod:'11pt', pie:'8pt'},
  a4    :{lbl:'Hoja A4, 8 por página', page:'A4',
          w:95, h:66,  rot:false, cw:95, ch:66,  pad:7,  lineas:2, min:12,max:26,
          top:'8.5pt',cod:'12pt', pie:'8.5pt'},
};
const etiqRows=()=>S.rows.filter(r=>r.z==='RETIRO');
const trkCorto=t=>String(t).replace(/^0+/,'')||t;

// el nombre se agranda hasta llenar el renglón: "Chiara Pinto" sale enorme,
// "Macarena Belen Pereyra" achica lo justo para entrar en dos líneas
function tamNombre(n,f){
  const pal=String(n).split(/\s+/).filter(Boolean);
  const larga=Math.max(1,...pal.map(p=>p.length));
  const porLinea=Math.max(larga,Math.ceil(String(n).length/f.lineas));
  const util=f.cw-f.pad*2;                       // mm disponibles a lo ancho
  return Math.round(Math.min(f.max,Math.max(f.min,util/(porLinea*0.62*0.3528))));
}
function etqHTML(r,f){
  const cuerpo=
    `<div class="etq-top" style="font-size:${f.top}">Retiro en el local</div>
     <div class="etq-nom" style="font-size:${tamNombre(r.d,f)}pt">${esc(r.d)}</div>
     <div class="etq-cod" style="font-size:${f.cod}">${esc(trkCorto(r.t))}</div>
     <div class="etq-pie" style="font-size:${f.pie}">
       <span>${esc(r.tel||'')}</span><span>${esc(r.raw[S.idx.fecha]||'')}</span></div>`;
  return f.rot
    ? `<div class="etq rot" style="width:${f.w}mm;height:${f.h}mm">
         <div class="etq-in" style="width:${f.cw}mm;height:${f.ch}mm;padding:${f.pad}mm">${cuerpo}</div></div>`
    : `<div class="etq" style="width:${f.w}mm;height:${f.h}mm;padding:${f.pad}mm">${cuerpo}</div>`;
}
function panelEtiquetas(){
  if(!S.rows.length){toast('Cargá el archivo de LightData primero');return}
  const todos=etiqRows();
  if(!todos.length){toast('Este archivo no tiene pedidos para retirar en el local');return}
  const pend=todos.filter(r=>!r.imp);
  const fmt=store.get('ng.fmt','t10x5');

  modal('Etiquetas de retiro',
    `${todos.length} pedidos para retirar${pend.length<todos.length?` · ${todos.length-pend.length} ya tienen etiqueta impresa`:''}`,
    `<div class="field"><label for="e-fmt">Formato</label>
       <select id="e-fmt" class="sel-zona" style="flex:1">${Object.entries(FORMATOS).map(([k,f])=>
         `<option value="${k}" ${k===fmt?'selected':''}>${f.lbl}</option>`).join('')}</select></div>
     <div class="prevetq" id="e-prev"></div>
     <div class="lista-etq" id="e-lista">${[...todos].sort((a,b)=>(a.imp===b.imp)?0:a.imp?1:-1).map(r=>
       `<label class="${r.imp?'hecha':''}"><input type="checkbox" data-etq="${r.i}" ${r.imp?'':'checked'}>
         <span>${esc(r.d)}</span>
         ${r.imp?'<span class="ya">Ya impresa</span>':`<span class="t">${esc(trkCorto(r.t))}</span>`}</label>`).join('')}</div>`,
    'Imprimir', ()=>{
      const sel=[...document.querySelectorAll('[data-etq]:checked')].map(c=>S.rows[+c.dataset.etq]);
      if(!sel.length){toast('No marcaste ninguna etiqueta');return}
      imprimir(sel,$('#e-fmt').value);
    });

  const pintar=()=>{
    const k=$('#e-fmt').value, f=FORMATOS[k];
    store.set('ng.fmt',k);
    const px=3.78;                                    // mm → px en pantalla
    const s=Math.min(320/(f.w*px), 210/(f.h*px), 1);  // que entre a lo ancho y a lo alto
    $('#e-prev').innerHTML=
      `<div style="width:${f.w*px*s}px;height:${f.h*px*s}px;position:relative">
         <div style="position:absolute;top:0;left:0;transform:scale(${s});transform-origin:top left">
           ${etqHTML(todos[0],f)}</div></div>`;
  };
  $('#e-fmt').onchange=pintar; pintar();
}
function imprimir(rows,k){
  const f=FORMATOS[k];
  $('#pagecss').textContent=`@page{size:${f.page};margin:${k==='a4'?'8mm':'0'}}`;
  $('#hoja').className='hoja '+k;
  $('#hoja').innerHTML=rows.map(r=>etqHTML(r,f)).join('');
  const marcar=()=>{
    rows.forEach(r=>r.imp=true); guardar(); render();
    toast(`${rows.length} etiquetas enviadas a imprimir. Si salieron mal, usá «Revertir etiquetas impresas».`);
    window.removeEventListener('afterprint',marcar);
  };
  window.addEventListener('afterprint',marcar);
  window.print();
}

/* ── MODAL GENÉRICO ── */
let onOk=null;
function modal(titulo,texto,html,ok,cb){
  $('#mt').textContent=titulo; $('#mp').textContent=texto;
  $('#mbody').innerHTML=html; $('#m-ok').textContent=ok; onOk=cb; $('#veil').hidden=false;
}
$('#m-cancel').onclick=()=>{$('#veil').hidden=true;onOk=null};
$('#m-ok').onclick=()=>{if(onOk)onOk();$('#veil').hidden=true;onOk=null};

/* ── EVENTOS ── */
$('#btn-load').onclick=()=>$('#fin').click();
$('#fin').onchange=e=>{if(e.target.files[0])leer(e.target.files[0]); e.target.value=''};
$('#btn-refrescar').onclick=()=>cargarDesdeURL();
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderBody()});
$('#zsel').onchange=e=>{S.zona=e.target.value;renderBody()};
$('#obsf').onclick=e=>{S.obs=!S.obs;e.currentTarget.setAttribute('aria-pressed',S.obs);renderBody()};
$('#bulk-x').onclick=()=>{S.sel.clear();render()};
$('#btn-more').onclick=()=>{const m=$('#menu');m.hidden=!m.hidden};
$('#x-hugo').onclick=()=>exportar('hugo','Hugo');
$('#x-rueddo').onclick=()=>exportar('rueddo','Rueddo');
$('#x-etiq').onclick=panelEtiquetas;
$('#x-todo').onclick=prepararTodo;

function prepararTodo(){
  if(!S.rows.length){toast('Cargá el archivo de LightData primero');return}
  const h=S.rows.filter(r=>r.k==='hugo'&&r.z!=='RETIRO'&&!r.proc);
  const ru=S.rows.filter(r=>r.k==='rueddo'&&r.z!=='RETIRO'&&!r.proc);
  if(!h.length&&!ru.length){toast('No hay pendientes para preparar');return}
  const f0=hoy();
  const sH=numSugerido('hugo', f0);
  const sR=numSugerido('rueddo', f0);
  modal('Preparar todo — Hugo y Rueddo',
    `${h.length} de Hugo + ${ru.length} de Rueddo = ${h.length+ru.length} envíos pendientes`,
    `<div class="field"><label for="e-fecha">Fecha del archivo</label>
       <input id="e-fecha" type="text" value="${f0}" placeholder="dd-mm-aaaa"></div>
     <div class="field"><label>Nº Hugo</label>
       <input id="e-num-h" type="number" min="1" step="1" value="${sH.nSug}" style="width:88px">
       <span class="sub" id="e-hint-h" style="flex:none">${sH.ult?`último Hugo esta fecha: ${sH.ult}`:'primero de Hugo'}</span></div>
     <div class="field"><label>Nº Rueddo</label>
       <input id="e-num-r" type="number" min="1" step="1" value="${sR.nSug}" style="width:88px">
       <span class="sub" id="e-hint-r" style="flex:none">${sR.ult?`último Rueddo esta fecha: ${sR.ult}`:'primero de Rueddo'}</span></div>
     <label class="chk"><input type="checkbox" id="e-rep">
       Reemplazar «Fecha de venta» de todas las filas por esa fecha</label>
     <div class="prev">Se van a descargar <b id="e-nom-h"></b> y <b id="e-nom-r"></b></div>`,
    'Descargar ambos',()=>{
      const f=$('#e-fecha').value.trim()||f0;
      const nH=Number($('#e-num-h').value.trim())||sH.nSug;
      const nR=Number($('#e-num-r').value.trim())||sR.nSug;
      const rep=$('#e-rep').checked?f:'';
      if(h.length){
        bajar(h,`HUGO_${f}_${nH}.xlsx`,rep,'Hugo');
        guardarNum('hugo', f, nH);
      }
      if(ru.length){
        bajar(ru,`RUEDDO_${f}_${nR}.xlsx`,rep,'Rueddo');
        guardarNum('rueddo', f, nR);
      }
      toast(`Listo: ${h.length} Hugo + ${ru.length} Rueddo descargados`);
    });
  const pinta=()=>{
    const f=$('#e-fecha').value.trim()||f0;
    const nH=$('#e-num-h').value.trim()||sH.nSug;
    const nR=$('#e-num-r').value.trim()||sR.nSug;
    $('#e-nom-h').textContent=h.length?`HUGO_${f}_${nH}.xlsx`:'(sin Hugo)';
    $('#e-nom-r').textContent=ru.length?`RUEDDO_${f}_${nR}.xlsx`:'(sin Rueddo)';
  };
  const alCambiarFecha=()=>{
    const f=$('#e-fecha').value.trim()||f0;
    const a=numSugerido('hugo', f), b=numSugerido('rueddo', f);
    $('#e-num-h').value=a.nSug; $('#e-num-r').value=b.nSug;
    $('#e-hint-h').textContent=a.ult?`último Hugo esta fecha: ${a.ult}`:'primero de Hugo';
    $('#e-hint-r').textContent=b.ult?`último Rueddo esta fecha: ${b.ult}`:'primero de Rueddo';
    pinta();
  };
  $('#e-fecha').oninput=alCambiarFecha;
  $('#e-num-h').oninput=pinta; $('#e-num-r').oninput=pinta;
  pinta();
}

$('#btn-auto').onclick=()=>{
  if(!S.rows.length){toast('Cargá el archivo primero');return}
  const n=S.rows.filter(r=>r.k!==r.base).length;
  if(!n){toast('No hay cambios manuales: todo está como lo decide la lista de CPs');return}
  modal('Restablecer reparto automático',
    `${n} envíos los cambiaste a mano. Vuelven a lo que dice la lista de códigos postales.`,'',
    'Restablecer',()=>{S.rows.forEach(r=>r.k=r.base);guardar();render();
      toast(`${n} envíos volvieron al reparto automático`)});
};
$('#m-cps').onclick=()=>{
  $('#menu').hidden=true;
  const txt=store.get('ng.cphugo',CP_HUGO_TXT);
  // qué dice esta lista sobre el archivo que está cargado ahora
  const cabaFuera=[...new Set(S.rows.filter(r=>r.z==='CABA'&&r.base==='rueddo').map(r=>r.cp))].sort();
  const sinCP=[...new Set(S.rows.filter(r=>!r.base).map(r=>r.cp||'(vacío)'))];
  const nota=!S.rows.length ? 'Cargá un archivo para ver cómo cae esta lista sobre los envíos del día.'
    : [`${S.rows.filter(r=>r.base==='hugo').length} envíos van a Hugo, ${S.rows.filter(r=>r.base==='rueddo').length} a Rueddo.`,
       cabaFuera.length?`De Capital quedan fuera de la lista y van a Rueddo: ${cabaFuera.join(', ')}.`:'',
       sinCP.length?`Sin CP válido, quedan sin asignar: ${sinCP.join(', ')}.`:''
      ].filter(Boolean).join(' ');
  modal('Códigos postales de Hugo',
    `${CP_HUGO.size} códigos. Todo lo que no esté en esta lista se lo lleva Rueddo, salvo los retiros.`,
    `<textarea id="e-cps" spellcheck="false">${esc(txt)}</textarea>
     <div class="ayuda">Uno por línea o separados por espacios. Se aceptan rangos: <b>1425-1431</b></div>
     <div class="prev">${esc(nota)}</div>`,
    'Guardar y reasignar',()=>{
      const nuevo=$('#e-cps').value;
      const set=expandir(nuevo);
      if(!set.size){toast('La lista quedó vacía. No guardé nada.');return}
      store.set('ng.cphugo',nuevo); CP_HUGO=set;
      const mem=store.get('ng.asig',{});
      S.rows.forEach(r=>{
        r.base=repartidor(r.cp);
        const ov=Object.prototype.hasOwnProperty.call(mem,r.t)?mem[r.t]:undefined;
        r.k = ov===undefined ? r.base : (ov||null);
      });
      render();
      toast(`${set.size} códigos guardados · ${S.rows.filter(r=>r.base==='hugo').length} envíos van a Hugo`);
    });
};
$('#m-revert').onclick=()=>{
  $('#menu').hidden=true;
  const n=S.rows.filter(r=>r.imp).length;
  if(!n){toast('Todavía no imprimiste ninguna etiqueta');return}
  modal('Revertir etiquetas impresas',
    `Las ${n} etiquetas vuelven a quedar pendientes para volver a imprimirlas.`,'',
    'Revertir',()=>{S.rows.forEach(r=>r.imp=false);guardar();render();
      toast(`${n} etiquetas marcadas como pendientes`)});
};
$('#m-clear').onclick=()=>{
  $('#menu').hidden=true;
  modal('¿Borrar la memoria guardada?','Se pierden los cambios manuales, los envíos procesados y las etiquetas impresas. El reparto vuelve a lo que dice la lista de CPs. El archivo cargado no se toca.',
    '','Borrar memoria',()=>{
      store.del('ng.asig');store.del('ng.proc');
      store.del('ng.imp');store.del('ng.bultos');
      S.rows.forEach(r=>{r.k=r.base; r.proc=false; r.imp=false; r.bultos=1});
      render(); toast('Memoria borrada');
    });
};

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]'); if(f){S.filter=f.dataset.f;render();return}
  const a=e.target.closest('#alloc button'); if(a){S.filter=a.dataset.k;render();return}
  const z=e.target.closest('[data-z]'); if(z){S.zona=S.zona===z.dataset.z?'':z.dataset.z;$('#zsel').value=S.zona;renderBody();return}
  const s=e.target.closest('[data-set]'); if(s){assign([+s.dataset.row],s.dataset.set);return}
  const rev=e.target.closest('[data-rev]');
  if(rev){
    const r=S.rows[+rev.dataset.rev];
    r.proc=false; guardar(); render();
    toast(`«${r.d}» volvió a pendiente — podés sacarlo de nuevo`);
    return;
  }
  const dl=e.target.closest('[data-dl]');
  if(dl){
    const r=S.rows[+dl.dataset.dl];
    if(!r.k||r.z==='RETIRO'){toast('Asigná el envío primero');return}
    exportar(r.k, KEYS[r.k], [r.i]);
    return;
  }
  const b=e.target.closest('.bulk .assign button');
  if(b){const n=S.sel.size;assign([...S.sel],b.dataset.k);S.sel.clear();render();
    toast(b.dataset.k==='clear'?`${n} envíos sin asignar`:`${n} envíos a ${KEYS[b.dataset.k]}`);return}
  const tr=e.target.closest('tbody tr');
  if(tr&&!e.target.closest('input,button,.zona')){S.act=+tr.dataset.row;render()}
  if(!e.target.closest('.menu-wrap'))$('#menu').hidden=true;
});
document.addEventListener('change',e=>{
  if(e.target.id==='all'){
    const v=visible().filter(r=>r.z!=='RETIRO');
    e.target.checked?v.forEach(r=>S.sel.add(r.i)):v.forEach(r=>S.sel.delete(r.i));render();return}
  if(e.target.dataset.sel!==undefined){
    const i=+e.target.dataset.sel; e.target.checked?S.sel.add(i):S.sel.delete(i); render()}
  if(e.target.dataset.bultos!==undefined){
    const r=S.rows[+e.target.dataset.bultos];
    let n=parseInt(e.target.value,10);
    if(isNaN(n)||n<1) n=1;
    if(n>20) n=20;
    r.bultos=n;
    e.target.value=n;
    guardar();
    // no re-render completo para no perder foco; solo actualizamos si hace falta
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input:not([type=checkbox]),select,textarea'))return;
  if(e.key==='Escape'){$('#veil').hidden=true;$('#menu').hidden=true;onOk=null;return}
  const v=visible(); if(!v.length)return;
  const p=v.findIndex(r=>r.i===S.act);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const nx=e.key==='ArrowDown'?Math.min(p+1,v.length-1):Math.max(p-1,0);
    S.act=v[p<0?0:nx].i; render();
    document.querySelector('tr.is-active')?.scrollIntoView({block:'nearest'});
    return;
  }
  if(S.act===null)return;
  const m={h:'hugo',r:'rueddo',n:'stop'}[e.key.toLowerCase()];
  if(m){e.preventDefault();assign([S.act],m)}
  if(e.key===' '){e.preventDefault();
    if(S.rows[S.act].z==='RETIRO')return;
    S.sel.has(S.act)?S.sel.delete(S.act):S.sel.add(S.act);render()}
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();
  if(e.dataTransfer.files[0])leer(e.dataTransfer.files[0])});

render();
// Carga automática al abrir la página (busca /data/envioslightdata.csv que sube el GitHub Action).
// Si todavía no existe o falla, no pasa nada: queda la pantalla de "Cargar archivo" para hacerlo a mano.
cargarDesdeURL(true);
setInterval(()=>cargarDesdeURL(true), 10*60*1000);
</script>
